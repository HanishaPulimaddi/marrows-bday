<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6B0F0F">
<meta name="description" content="Somewhere to put them.">
<title>Lists</title>

<link rel="manifest" href="/app/manifest.json">
<link rel="icon" href="/app/icons/icon-192.png">
<link rel="apple-touch-icon" href="/app/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lists">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app/app.css">
</head>

<body>

<!-- install banner: shown once, only when the browser offers the prompt -->
<div class="install" id="install" hidden>
  <span class="install-text">add to home screen</span>
  <button class="install-yes" id="installYes" type="button">add</button>
  <button class="install-no" id="installNo" type="button" aria-label="dismiss">&times;</button>
</div>

<header class="head">
  <h1 class="title">Lists</h1>
  <p class="sub" id="count"></p>
</header>

<main class="scroll" id="scroll">
  <section class="group" id="openGroup" aria-label="Notes">
    <ul class="notes" id="openList"></ul>
  </section>

  <section class="group done" id="doneGroup" hidden>
    <h2 class="group-label">done</h2>
    <ul class="notes" id="doneList"></ul>
  </section>

  <p class="empty" id="empty" hidden>Nothing yet.<br>Write the first one below.</p>
</main>

<!-- composer sits in the lower half, within thumb reach -->
<form class="composer" id="composer" autocomplete="off">

  <!-- asks only when tapped; a prompt on load gets denied, and denial is forever -->
  <button class="rem-prompt" id="remPrompt" type="button" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
    </svg>
    turn on reminders
  </button>

  <textarea class="input" id="text" rows="1" placeholder="what do you need to remember?"
            enterkeyhint="enter" aria-label="Note"></textarea>

  <div class="row">
    <label class="toggle">
      <input type="checkbox" id="remindOn">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="toggle-label">set reminder</span>
    </label>

    <input class="when" id="when" type="datetime-local" aria-label="Reminder time" hidden>

    <button class="save" id="save" type="submit">save</button>
  </div>

  <p class="rem-off" id="remDenied" hidden>reminders are off — enable notifications for this app in Chrome settings</p>
</form>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button class="undo" id="undo" type="button">undo</button>
</div>

<script type="module" src="/app/app.js"></script>
</body>
</html>
